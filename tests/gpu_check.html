<!doctype html><meta charset="utf-8"><title>gpu check</title>
<!-- Runs the GPU engine (web/gpu.js) and the JS engine (web/engine.js) on the same
     frames of an exported site in this directory and compares them; the result is
     written to document.title as JSON for tests/test_gpu.py (via tests/cdp_title.js). -->
<script src="engine.js"></script><script src="gpu.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), frames = +(q.get('frames') || 3), out = { ok: false };
  try {
    const meta = await (await fetch('machine.json')).json();
    const wr = await fetch('walls.bin.gz');
    const squares = new Uint16Array(await new Response(wr.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    const J = new Machine(meta, squares), t0 = performance.now();
    const G = await new GpuMachine(meta, squares).init();
    out.gpu = G.info; out.initMs = Math.round(performance.now() - t0);
    const P = meta.P, diffs = [], times = [];
    for (let k = 0; k < frames; k++) {
      const inp = { left: k % 7 === 0 ? 1 : 0, right: k % 5 === 0 ? 1 : 0, reset: k === 0 ? 1 : 0 };
      const traces = k % 3 === 0 ? [[16, 16], [148, 1], [297, 1]] : k % 3 === 1 ? [[446, 1], [594, 1], [743, 1]] : [[5000, 16], [20000, 1], [P - 1, 3]];
      const a = J.frame(inp, traces), t1 = performance.now(), b = await G.frame(inp, traces);
      times.push(Math.round(performance.now() - t1));
      if (JSON.stringify(a.state) !== JSON.stringify(b.state) || a.win !== b.win || a.lose !== b.lose) diffs.push({ k, js: a.state, gpu: b.state });
      a.pics.forEach((pa, i) => {
        const pb = b.pics[i], sa = [], sb = [];
        if (JSON.stringify(pa.counts) !== JSON.stringify(pb.counts)) { diffs.push({ k, pic: i, counts: [pa.counts, pb.counts] }); return; }
        for (let j = 0; j < pa.raw.length; j += 2) { sa.push(pa.raw[j] * 65536 + pa.raw[j + 1]); sb.push(pb.raw[j] * 65536 + pb.raw[j + 1]); }
        let o = 0;
        for (const c of pa.counts) {  // same cells at every recorded step (any order)
          const x = sa.slice(o, o + c).sort(), y = sb.slice(o, o + c).sort(); o += c;
          if (JSON.stringify(x) !== JSON.stringify(y)) { diffs.push({ k, pic: i, cells: [x.length, x.slice(0, 4), y.slice(0, 4)] }); break; }
        }
      });
      out.alive = b.alive;
    }
    out.frames = frames; out.msPerFrame = times; out.diffs = diffs.slice(0, 5); out.ok = diffs.length === 0;
  } catch (e) { out.error = String(e); }
  window.__out = out; document.title = JSON.stringify(out);
})();
</script>
